name: test
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Run-Tests.ps1
      - name: Tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File Run-Tests.ps1
      - name: Extra safety tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Run-Extra-Tests.ps1
      - name: Extra safety tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File Run-Extra-Tests.ps1
      - name: New safety regressions (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Run-Safety-Regression.ps1
      - name: New safety regressions (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File Run-Safety-Regression.ps1
      - name: Window builds
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File PhotoSorter.ps1 -SelfTest
      - name: Drive the window and photograph it
        shell: powershell
        run: |
          $r = Join-Path $env:RUNNER_TEMP 'demo'
          New-Item -ItemType Directory -Path $r -Force | Out-Null
          $src = & ./Make-Demo.ps1 -Root $r
          $shots = Join-Path $r 'shots'; New-Item -ItemType Directory -Path $shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host ("Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width + "x" + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File PhotoSorter.ps1 -SelfTest -DemoSource $src -DemoDest (Join-Path $r 'Sorted') -ShotDir $shots
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem (Join-Path $r 'Sorted') -Recurse -File | ForEach-Object { $_.FullName.Substring($r.Length) }
