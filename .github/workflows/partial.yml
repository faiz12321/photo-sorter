name: partial-copy-window
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Drive an actual partial failure and photograph it
        shell: powershell
        run: |
          $r = Join-Path $env:RUNNER_TEMP 'partial-demo'
          New-Item -ItemType Directory -Path $r -Force | Out-Null
          $src = & ./Make-Demo.ps1 -Root $r
          $shots = Join-Path $r 'shots'; New-Item -ItemType Directory -Path $shots | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File PhotoSorter.ps1 -SelfTest -SelfTestPartial -DemoSource $src -DemoDest (Join-Path $r 'Sorted') -ShotDir $shots
          if ($LASTEXITCODE -ne 0) { exit 1 }
